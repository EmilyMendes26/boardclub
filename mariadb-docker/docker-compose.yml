version: '3.8'

services:
  mariadb:
    image: mariadb:11.3
    container_name: mariadb_container
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 123
      MARIADB_DATABASE: boardclub
      MARIADB_USER: boardclubTeam
      MARIADB_PASSWORD: 123
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: